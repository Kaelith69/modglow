<text x="360" y="744" fill="#080605" font-size="20" font-weight="700">Reddit confirms persisted comment state. Redis stores short locks and management metadata.</text>
<text x="104" y="775" fill="#39352E" font-size="17">Routes orchestrate modules. The app account authors the comment. Reddit hosts the uploaded image.</text>
