<text x="58" y="70" fill="#F5F0E6" font-family="Arial,sans-serif" font-size="30" font-weight="900">SYSTEM MAP</text><text x="58" y="102" fill="#AAB6C4" font-family="Arial,sans-serif" font-size="17">Actual runtime boundaries and service calls</text>
<g font-family="Arial,sans-serif">
