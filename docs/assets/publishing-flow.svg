<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
<title id="title">ModGlow publishing workflow</title><desc id="desc">A numbered flowchart from moderator input through validation, rendering, upload, comment submission, pin verification, and safe handling of failures.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 9 3 0 6Z" fill="#F5F0E6"/></marker></defs>
<rect width="1200" height="920" rx="18" fill="#0B1017"/><path d="M22 68 70 22H1178V850L1130 898H22Z" fill="none" stroke="#F5F0E6" stroke-width="4"/>
<text x="58" y="70" fill="#F5F0E6" font-family="Arial,sans-serif" font-size="30" font-weight="900">PUBLISHING PIPELINE</text>
<g font-family="Arial,sans-serif" font-size="19" font-weight="bold" text-anchor="middle">
<rect x="380" y="110" width="440" height="70" rx="12" fill="#142536" stroke="#1688F5" stroke-width="4"/><text x="600" y="153" fill="#F5F0E6">1 · Moderator submits the form</text>
<rect x="380" y="220" width="440" height="80" rx="12" fill="#1C2630" stroke="#F5F0E6" stroke-width="3"/><text x="600" y="252" fill="#F5F0E6">2 · Validate input, flair, post</text><text x="600" y="278" fill="#F5F0E6">and moderator permission</text>
<rect x="380" y="340" width="440" height="70" rx="12" fill="#1C2630" stroke="#F29A38" stroke-width="4"/><text x="600" y="383" fill="#F5F0E6">3 · Acquire per post Redis lock</text>
<rect x="380" y="450" width="440" height="70" rx="12" fill="#1C2630" stroke="#8CFF00" stroke-width="4"/><text x="600" y="493" fill="#F5F0E6">4 · Build SVG, rasterise and upload PNG</text>
<rect x="380" y="560" width="440" height="70" rx="12" fill="#1C2630" stroke="#1688F5" stroke-width="4"/><text x="600" y="603" fill="#F5F0E6">5 · Build and submit one app comment</text>
<path d="M600 630V670" stroke="#F5F0E6" stroke-width="3" marker-end="url(#arr)"/>
<path d="M600 670 820 740 600 810 380 740Z" fill="#18271D" stroke="#8CFF00" stroke-width="4"/><text x="600" y="733" fill="#F5F0E6">6 · Verify distinguished</text><text x="600" y="760" fill="#F5F0E6">and stickied state</text>
<rect x="70" y="690" width="250" height="100" rx="12" fill="#18271D" stroke="#8CFF00" stroke-width="4"/><text x="195" y="730" fill="#F5F0E6">Verified</text><text x="195" y="758" fill="#B7C2CF" font-size="16">Success · release lock</text>
<rect x="880" y="680" width="250" height="120" rx="12" fill="#321C1D" stroke="#E63B35" stroke-width="4"/><text x="1005" y="720" fill="#F5F0E6">Mismatch</text><text x="1005" y="748" fill="#B7C2CF" font-size="16">Attempt cleanup</text><text x="1005" y="773" fill="#B7C2CF" font-size="16">if explicitly confirmed</text>
<path d="M380 740H325M820 740H875" stroke="#F5F0E6" stroke-width="3" marker-end="url(#arr)"/>
<path d="M1005 800V850H600V815" fill="none" stroke="#E63B35" stroke-width="2" stroke-dasharray="8 7"/>
<text x="600" y="875" fill="#B7C2CF" font-size="15" text-anchor="middle">Ambiguous submission or verification: warn, preserve retry lock until expiry, and ask moderator to inspect post.</text>
</g></svg>