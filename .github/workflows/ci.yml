name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=moderate
      - run: npm run check
