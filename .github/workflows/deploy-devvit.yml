name: Deploy to Devvit

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devvit-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and upload Devvit app
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Devvit CLI authentication
        env:
          DEVVIT_TOKEN: ${{ secrets.DEVVIT_TOKEN }}
          DEVVIT_SESSION_ID: ${{ secrets.DEVVIT_SESSION_ID }}
        run: |
          if [ -z "$DEVVIT_TOKEN" ] || [ -z "$DEVVIT_SESSION_ID" ]; then
            echo "::error::Missing Devvit credentials. Add DEVVIT_TOKEN (full JSON from ~/.devvit/token) and DEVVIT_SESSION_ID (contents of ~/.devvit/session-id) as repository Actions secrets."
            exit 1
          fi

          mkdir -p "$HOME/.devvit"
          printf '%s' "$DEVVIT_TOKEN" > "$HOME/.devvit/token"
          printf '%s' "$DEVVIT_SESSION_ID" > "$HOME/.devvit/session-id"
          chmod 600 "$HOME/.devvit/token" "$HOME/.devvit/session-id"

      - name: Verify Devvit authentication
        run: npx devvit whoami

      - name: Validate and upload
        run: npm run deploy
