name: Deploy to Devvit

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devvit-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and upload Devvit app
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Devvit authentication
        env:
          DEVVIT_AUTH_TOKEN: ${{ secrets.DEVVIT_AUTH_TOKEN }}
        run: |
          if [ -z "$DEVVIT_AUTH_TOKEN" ]; then
            echo "::error::Missing DEVVIT_AUTH_TOKEN repository secret."
            exit 1
          fi
          echo "DEVVIT_AUTH_TOKEN is configured."

      - name: Validate and upload
        env:
          DEVVIT_AUTH_TOKEN: ${{ secrets.DEVVIT_AUTH_TOKEN }}
        run: npm run deploy
